services:
  email-filter:
    build: .
    image: email-filter-api
    container_name: email-filter-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Keeps the downloaded model between restarts. To use a locally trained
      # model instead, replace with: ./spam_detection_model:/app/spam_detection_model:ro
      - model_data:/app/spam_detection_model
    restart: unless-stopped

volumes:
  model_data:
