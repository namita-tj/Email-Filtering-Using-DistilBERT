name: Train and evaluate

# Started by hand from the Actions tab ("Run workflow").
# GitHub's free runners have no GPU, so the defaults are sized to finish on CPU
# within the 6-hour job limit. Use Colab or another GPU machine for a full run.
on:
  workflow_dispatch:
    inputs:
      train_limit:
        description: "Training emails to use (0 = all 28.5k; CPU needs a limit)"
        default: "4000"
      epochs:
        description: "Epochs"
        default: "2"
      max_length:
        description: "Tokens per email"
        default: "128"
      xai_samples:
        description: "Emails for the explainability evaluation"
        default: "100"

permissions:
  contents: read

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TRAIN_LIMIT: ${{ inputs.train_limit }}
      EPOCHS: ${{ inputs.epochs }}
      MAX_LENGTH: ${{ inputs.max_length }}
      LLM_PROVIDER: none
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_USE_LEGACY_KERAS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            training/requirements.txt
      - name: Install
        run: pip install -r requirements.txt -r training/requirements.txt
      - name: Train
        run: python -m training.train
      - name: Evaluate
        run: |
          python -m evaluation.run --phishing --no-llm \
            --xai-samples ${{ inputs.xai_samples }} --steps 16
      - name: Summary
        if: always()
        run: |
          {
            echo "Run settings: TRAIN_LIMIT=$TRAIN_LIMIT, EPOCHS=$EPOCHS, MAX_LENGTH=$MAX_LENGTH, CPU only"
            echo
            cat reports/kpis.md 2>/dev/null || echo "No KPI report was produced."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            reports/
            docs/explanation_example.svg
            spam_detection_model/metrics.json
            spam_detection_model/thresholds.json
            spam_detection_model/training_config.json
          if-no-files-found: warn
